name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      - name: Download dependencies
        env:
          GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt ${attempt}/3); retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install tooling
        run: make install-tools

      # Lint and tests are independent gates and both must report. Until this became
      # `continue-on-error`, a lint failure skipped the test step entirely, so five
      # consecutive red runs produced zero evidence about whether the tests passed —
      # and one genuine host-dependent test failure stayed invisible underneath it.
      - name: Run lint
        id: lint
        continue-on-error: true
        env:
          LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The default golangci-lint timeout is 1m; this repository takes longer, so the
          # lint step was failing on the clock rather than on findings (exit 4).
          if [ -n "$LINT_BASE" ] && git rev-parse --verify "$LINT_BASE" >/dev/null 2>&1; then
            golangci-lint run --timeout=10m --new-from-rev="$LINT_BASE" ./...
          else
            golangci-lint run --timeout=10m ./...
          fi

      - name: Run tests
        run: make test

      - name: Report lint outcome
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::error title=Lint failed::golangci-lint reported findings; the test step above ran regardless, so read both results"
          exit 1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.txt
